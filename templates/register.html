{% extends "base.html" %}
{% block title %}Register — Blood Bank{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="mb-4">Create your account</h2>
        <form method="POST">

          <div class="mb-3">
            <label class="form-label">I am a...</label>
            <select name="role" class="form-select" required>
              <option value="donor">Donor — I want to donate blood</option>
              <option value="patient">Patient — I need blood</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone number</label>
            <input type="text" name="phone" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Blood group</label>
            <select name="blood_group" class="form-select" required>
              {% for bg in blood_groups %}
                <option value="{{ bg }}">{{ bg }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">City / area</label>
            <input type="text" name="city" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-danger w-100">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
