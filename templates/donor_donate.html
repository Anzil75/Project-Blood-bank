{% extends "base.html" %}
{% block title %}Donate Blood{% endblock %}
{% block content %}
<a href="{{ url_for('donor_dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">← Back to dashboard</a>
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
      <h2 class="mb-4">🩸 Donate Blood</h2>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Blood group</label>
          <select name="blood_group" class="form-select" required>
            {% for bg in blood_groups %}
            <option value="{{ bg }}" {% if bg == preselect %}selected{% endif %}>{{ bg }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Units to donate</label>
          <input type="number" name="units" min="1" value="1" class="form-control" required>
        </div>
        <button class="btn btn-danger w-100">Confirm Donation</button>
      </form>
      <p class="text-muted mt-3 mb-0">Your donation is added straight to the blood bank's stock.</p>
    </div></div>
  </div>
</div>
{% endblock %}
